<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Access</title>
    <style>
        body {
            background-color: #0d1117;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            border: 1px solid #00ff66;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            max-width: 90%;
            width: 100%;
            text-align: left;
        }
        #hoto {
            display: none;
            max-width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            border: 2px solid #00ff66;
        }
        .terminal-line {
            margin: 5px 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="box">
        <div id="terminal">
            <div class="terminal-line">[root@system ~]# ping -c 5 target.secret.node</div>
        </div>
        
        <img id="hoto" src="https://i.postimg.cc/QNzKS65z/IMG-1562.png" alt="Secret Image">
    </div>

    <script>
        let seconds = 5;
        const terminal = document.getElementById('terminal');
        
        const countdown = setInterval(() => {
            if (seconds > 0) {
                const line = document.createElement('div');
                line.className = 'terminal-line';
                line.textContent = `64 bytes from target.secret.node: seq=${6 - seconds} ttl=64 time=${(Math.random() * 20 + 10).toFixed(2)} ms`;
                terminal.appendChild(line);
                seconds--;
            } else {
                clearInterval(countdown);
                const finalLine = document.createElement('div');
                finalLine.className = 'terminal-line';
                finalLine.style.color = '#fff';
                finalLine.style.fontWeight = 'bold';
                finalLine.style.marginTop = '10px';
                finalLine.textContent = '[System Output] Access Granted! Displaying payload 👇';
                terminal.appendChild(finalLine);
                
                document.getElementById('hoto').style.display = 'block';
            }
        }, 1000);
    </script>

</body>
</html>
