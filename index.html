<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Access</title>
    <style>
        body {
            background-color: #0d1117;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            border: 1px solid #00ff66;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            max-width: 90%;
            width: 100%;
            text-align: left;
        }
        #hoto {
            display: none;
            max-width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            border: 2px solid #00ff66;
        }
        .terminal-line {
            margin: 5px 0;
            font-size: 0.95rem;
        }
        #pass-area {
            display: none;
            margin-top: 15px;
        }
        input[type="password"] {
            background: #161b22;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 8px 12px;
            font-family: inherit;
            border-radius: 4px;
            outline: none;
        }
        button {
            background: #00ff66;
            color: #0d1117;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            font-family: inherit;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }
        button:hover {
            background: #00cc52;
        }
        #msg {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="box">
        <div id="terminal">
            <div class="terminal-line">[root@system ~]# ping -c 10 target.secret.node</div>
        </div>

        <div id="pass-area">
            <div class="terminal-line" style="color: #fff;">[System] Authentication Required. Enter Password:</div>
            <input type="password" id="passwordInput" placeholder="Enter password...">
            <button onclick="checkPassword()">UNLOCK</button>
            <div id="msg"></div>
        </div>
        
        <!-- SABON HOTONKA MAI LINK: https://i.postimg.cc/Dz7cFCx0/IMG-1763.png -->
        <img id="hoto" src="https://i.postimg.cc/Dz7cFCx0/IMG-1763.png" alt="Secret Image">
    </div>

    <script>
        let count = 1;
        const totalPings = 10;
        const terminal = document.getElementById('terminal');
        
        const countdown = setInterval(() => {
            if (count <= totalPings) {
                const line = document.createElement('div');
                line.className = 'terminal-line';
                line.textContent = `64 bytes from target.secret.node: seq=${count} ttl=64 time=${(Math.random() * 20 + 10).toFixed(2)} ms`;
                terminal.appendChild(line);
                count++;
            } else {
                clearInterval(countdown);
                document.getElementById('pass-area').style.display = 'block';
            }
        }, 700); // Yanzu yana fitar da rubutu cikin sauri da dadin kallo

        function checkPassword() {
            const pass = document.getElementById('passwordInput').value;
            const msg = document.getElementById('msg');
            
            // PASSWORD: Hajara
            if (pass === "Hajara") {
                msg.style.color = "#00ff66";
                msg.textContent = "[System Output] Access Granted! Displaying payload 👇";
                document.getElementById('hoto').style.display = 'block';
                document.getElementById('pass-area').style.display = 'none';
            } else {
                msg.style.color = "#ff3333";
                msg.textContent = "[Error] Access Denied! Incorrect Password.";
            }
        }
    </script>

</body>
</html>
